<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D.S.O.">
<meta name="theme-color" content="#10120f">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2310120f'/><rect x='8' y='8' width='84' height='84' fill='none' stroke='%23b4c82e' stroke-width='2'/><path d='M50 20 L50 80 M20 50 L80 50' stroke='%23b4c82e' stroke-width='1' opacity='0.5'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23b4c82e' stroke-width='2.5'/><circle cx='50' cy='50' r='4' fill='%23b4c82e'/><text x='50' y='95' font-family='Arial' font-size='9' font-weight='700' fill='%23b4c82e' text-anchor='middle' letter-spacing='1'>D.S.O.</text></svg>">
<title>D.S.O. — Field Conditioning Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #10120f;
  --bg-1: #161913;
  --bg-2: #1d2119;
  --bg-3: #262b20;
  --bg-4: #313829;
  --border: #2e3526;
  --border-2: #3d4632;
  --border-bright: #525e42;
  --text: #e6ead9;
  --text-dim: #a6af94;
  --text-dimmer: #5e6650;
  --olive: #b4c82e;
  --olive-bright: #c8dd3a;
  --olive-dark: #8a9a22;
  --olive-glow: rgba(180,200,46,.25);
  --amber: #e0a020;
  --amber-glow: rgba(224,160,32,.25);
  --red: #d44030;
  --red-glow: rgba(212,64,48,.3);
  --steel: #6a8caa;
  --done: #b4c82e;
  --done-glow: rgba(180,200,46,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{
  background:var(--bg);color:var(--text);
  font-family:'Rajdhani','Sarabun',-apple-system,sans-serif;
  font-weight:500;line-height:1.5;
  min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
}
body{
  background:
    radial-gradient(900px 500px at 85% -5%, rgba(180,200,46,.04) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-1) 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left);
  position:relative;overflow-x:hidden;
}
/* faint tactical grid */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image:
    linear-gradient(rgba(180,200,46,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,200,46,.025) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center, rgba(0,0,0,.6), transparent 75%);
}

.cond{font-family:'Barlow Condensed',sans-serif}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:520px;margin:0 auto;padding:18px 16px 80px;position:relative;z-index:3}

/* ============= HEADER ============= */
.header{padding:6px 2px 16px;position:relative}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--olive);font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.eyebrow .dot{width:6px;height:6px;background:var(--olive);border-radius:50%;box-shadow:0 0 6px var(--olive)}
.eyebrow .sep{color:var(--text-dimmer)}
.eyebrow .id{color:var(--text-dim)}
h1{
  font-family:'Barlow Condensed',sans-serif;
  font-size:38px;font-weight:700;line-height:.95;letter-spacing:.5px;
  margin-top:8px;text-transform:uppercase;color:var(--text);
}
h1 .accent{color:var(--olive)}
.tagline{
  color:var(--text-dim);font-size:12px;margin-top:6px;
  font-family:'JetBrains Mono',monospace;letter-spacing:.3px;
  display:flex;align-items:center;gap:7px;
}
.tagline::before{content:'';display:inline-block;width:6px;height:6px;background:var(--olive);flex-shrink:0}

/* ============= STATS ============= */
.stats{
  display:flex;margin:16px 0 14px;
  background:var(--bg-2);border:1px solid var(--border);
}
.stat{flex:1;text-align:center;padding:13px 8px;position:relative}
.stat + .stat::before{content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--border-2)}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--text);line-height:1}
.stat-val.hl{color:var(--olive)}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-top:5px;font-weight:500}

/* ============= TIMER BAR ============= */
.session-bar{
  padding:10px 14px 12px;margin-bottom:14px;
  background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--olive);
  position:sticky;top:8px;z-index:50;transition:all .2s;
}
.session-bar.running{border-color:var(--olive);box-shadow:0 0 20px var(--olive-glow);background:var(--bg-3)}
.session-bar.timer-mode{border-left-color:var(--amber)}
.session-bar.timer-mode.running{border-color:var(--amber);box-shadow:0 0 20px var(--amber-glow)}
.mode-tabs{display:flex;margin-bottom:10px;border-bottom:1px solid var(--border)}
.mode-tab{
  flex:1;padding:6px 4px;font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:1.5px;font-weight:500;text-transform:uppercase;
  color:var(--text-dim);background:transparent;border-bottom:2px solid transparent;transition:all .15s;
}
.mode-tab.active{color:var(--olive);border-bottom-color:var(--olive)}
.session-bar.timer-mode .mode-tab.active{color:var(--amber);border-bottom-color:var(--amber)}
.sw-row{display:flex;align-items:center;justify-content:space-between}
.sw-left{display:flex;flex-direction:column;gap:2px}
.sw-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);font-weight:500}
.sw-time{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1;letter-spacing:1px;color:var(--text);font-variant-numeric:tabular-nums}
.session-bar.running .sw-time{color:var(--olive)}
.session-bar.timer-mode.running .sw-time{color:var(--amber)}
.session-bar.timer-finished .sw-time{color:var(--olive);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.sw-controls{display:flex;gap:8px}
.sw-btn{
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border-2);background:var(--bg-3);transition:all .15s;
}
.sw-btn:active{transform:scale(.92)}
.sw-btn svg{width:14px;height:14px;color:var(--text)}
.sw-btn.primary{background:var(--olive);border-color:var(--olive)}
.sw-btn.primary svg{color:var(--bg)}
.session-bar.timer-mode .sw-btn.primary{background:var(--amber);border-color:var(--amber)}
.session-bar.running .sw-btn.primary{background:var(--bg);border-color:var(--olive)}
.session-bar.running .sw-btn.primary svg{color:var(--olive)}
.session-bar.timer-mode.running .sw-btn.primary{background:var(--bg);border-color:var(--amber)}
.session-bar.timer-mode.running .sw-btn.primary svg{color:var(--amber)}
.timer-presets{display:none;gap:5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.session-bar.timer-mode .timer-presets{display:flex;flex-wrap:wrap}
.preset-btn{
  flex:1;min-width:48px;padding:6px 4px;font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:500;background:var(--bg-3);border:1px solid var(--border-2);color:var(--text);transition:all .15s;
}
.preset-btn:active{transform:scale(.94)}
.preset-btn.active{background:var(--amber);border-color:var(--amber);color:var(--bg)}

/* ============= DAY TABS ============= */
.day-tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding:2px}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex:1;min-width:50px;padding:12px 4px;background:var(--bg-2);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;position:relative;
}
.day-tab.active{background:var(--olive);border-color:var(--olive)}
.day-tab.active .dn{color:var(--bg)}
.day-tab.active .ico svg{color:var(--bg)}
.day-tab.today:not(.active){border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.day-tab.today:not(.active) .dn{color:var(--olive)}
.day-tab.today:not(.active) .ico svg{color:var(--olive)}
.dn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--text-dim)}
.day-tab .ico svg{width:18px;height:18px;stroke-width:1.8;color:var(--text-dim)}
.day-tab .check-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--olive);display:none}
.day-tab.completed .check-dot{display:block}
.day-tab.active.completed .check-dot{background:var(--bg)}

/* ============= CARD ============= */
.card{background:var(--bg-2);border:1px solid var(--border);position:relative}
.card::before{content:'';position:absolute;top:0;left:0;width:40px;height:2px;background:var(--olive)}
.card::after{content:'';position:absolute;top:0;left:0;width:2px;height:40px;background:var(--olive)}
.card-head{padding:20px 20px 16px;border-bottom:1px solid var(--border);position:relative}
.card-icon-big{
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;
  background:var(--accent,var(--olive));position:relative;
}
.card-icon-big svg{width:24px;height:24px;color:var(--bg);stroke-width:2}
.card-day-label{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--olive);font-weight:500;display:flex;align-items:center;gap:6px;
}

.card-day-label .today-tag{margin-left:6px;padding:1px 7px;background:var(--olive);color:var(--bg);font-size:8.5px;letter-spacing:1.5px;font-weight:700}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1;margin-top:5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text)}
.card-focus{font-size:13px;color:var(--text-dim);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.2px;font-weight:400}
.card-focus::before{content:'';display:inline-block;width:6px;height:6px;background:var(--olive);margin-right:8px;vertical-align:2px}
.card-meta{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;
  background:var(--bg-3);color:var(--text-dim);border:1px solid var(--border-2);
}
.chip.hl{background:var(--olive);color:var(--bg);border-color:var(--olive)}
.chip svg{width:10px;height:10px;stroke-width:2.2}
.pillar-tag{
  display:inline-flex;align-items:center;padding:4px 10px;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;
  background:transparent;color:var(--steel);border:1px solid var(--steel);
}

.rationale{
  padding:13px 20px;background:var(--bg-1);border-bottom:1px solid var(--border);
  font-size:12.5px;color:var(--text-dim);line-height:1.55;display:flex;gap:10px;align-items:flex-start;
  font-family:'Rajdhani',sans-serif;font-weight:500;position:relative;
}
.rationale::before{content:'';position:absolute;left:0;top:0;height:100%;width:3px;background:var(--steel)}
.rationale .leaf{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--steel);font-size:14px;line-height:1.2;flex-shrink:0;letter-spacing:1px}

/* ============= PHASE / EXERCISE ============= */
.phases{padding:4px 0}
.phase{padding:14px 20px 6px}
.phase + .phase{border-top:1px solid var(--border);margin-top:6px;padding-top:16px}
.phase-label{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;
  color:var(--olive);font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.phase-label::before{content:'';display:inline-block;width:7px;height:7px;background:var(--olive);flex-shrink:0}
.phase-label .pl-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border-2) 0%,transparent 90%)}
.phase-label.daily{color:var(--amber)}
.phase-label.daily::before{background:var(--amber)}

.ex{padding:11px 0;border-bottom:1px dashed var(--border)}
.ex:last-child{border-bottom:none}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-weight:600;font-size:16px;color:var(--text);line-height:1.25;font-family:'Rajdhani',sans-serif}
.ex-note{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.4;font-family:'JetBrains Mono',monospace;font-weight:400}

.ex-sets-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);text-align:right;font-weight:500;letter-spacing:.5px;white-space:nowrap}
.ex-sets-label .num{font-family:'Barlow Condensed',sans-serif;font-size:19px;color:var(--olive);font-weight:700}

.sets{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.set-row{
  flex:1;min-width:64px;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 6px;background:var(--bg-3);border:1px solid var(--border-2);
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text);transition:all .15s;font-weight:500;
  cursor:pointer;user-select:none;letter-spacing:.5px;
}
.set-row .lbl{font-size:9.5px;letter-spacing:1px;color:var(--text-dim)}
.set-row.done{background:var(--olive);border-color:var(--olive);color:var(--bg)}
.set-row.done .lbl{color:var(--bg);opacity:.8}
.set-row.done::before{content:'✓';margin-right:2px;font-weight:700}

.single-row{
  margin-top:10px;display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:var(--bg-3);border:1px solid var(--border-2);cursor:pointer;user-select:none;transition:all .15s;
}
.single-row .check{width:18px;height:18px;border:2px solid var(--text-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.single-row.done{background:var(--olive);border-color:var(--olive);color:var(--bg)}
.single-row.done .check{background:var(--bg);border-color:var(--bg)}
.single-row.done .check::after{content:'✓';color:var(--olive);font-size:12px;font-weight:700}
.single-row .reps-text{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;color:var(--text);letter-spacing:.3px}
.single-row.done .reps-text{color:var(--bg)}

/* Game-day variant toggle (court vs contingency) */
.variant-swap{
  display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg-1);
}
.swap-btn{
  flex:1;padding:13px 8px;background:transparent;border:none;border-bottom:2px solid transparent;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--text-dimmer);transition:all .15s;
}
.swap-btn:active{transform:scale(.98)}
.swap-btn.active{color:var(--olive);border-bottom-color:var(--olive);background:var(--bg-2)}

/* Rest timer */
.rest-row{
  margin-top:12px;display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:16px 16px 20px;
  background:var(--bg-3);border:1px solid var(--border-2);font-family:'JetBrains Mono',monospace;
  letter-spacing:.4px;position:relative;overflow:hidden;transition:all .25s;
}
.rest-row.is-running{background:var(--bg-4);border-color:var(--amber);box-shadow:0 0 16px var(--amber-glow)}
.rest-row.is-done{border-color:var(--olive);box-shadow:0 0 14px var(--olive-glow)}
.rest-row .rest-progress{position:absolute;left:0;bottom:0;height:6px;width:0%;background:var(--amber);transition:width .3s linear}
.rest-row.is-done .rest-progress{background:var(--olive);width:100% !important}
.rest-row .rest-info{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.4px}
.rest-row .rest-info svg{width:19px;height:19px;stroke-width:2;color:var(--steel)}
.rest-row.is-running .rest-info{color:var(--amber)}
.rest-row.is-running .rest-info svg{color:var(--amber)}
.rest-row.is-done .rest-info{color:var(--olive)}
.rest-row.is-done .rest-info svg{color:var(--olive)}
.rest-btn{
  width:100%;padding:22px 16px;background:var(--bg-2);border:1px solid var(--border-bright);font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:500;color:var(--text);letter-spacing:.5px;display:flex;align-items:center;gap:16px;
  transition:all .15s;justify-content:center;
}
.rest-btn:active{transform:scale(.98)}
.rest-btn svg{width:24px;height:24px;flex-shrink:0}
.rest-btn.running{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.rest-btn.done{background:var(--olive);color:var(--bg);border-color:var(--olive)}
.rest-btn .timer-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:56px;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:.9}

/* Interval timer (auto work/rest cycling) */
.interval-widget{
  margin-top:10px;padding:14px 16px;background:var(--bg-3);border:1px solid var(--border-2);transition:all .25s;
}
.interval-widget.is-work{border-color:var(--olive);box-shadow:0 0 16px var(--olive-glow);background:var(--bg-4)}
.interval-widget.is-rest{border-color:var(--amber);box-shadow:0 0 16px var(--amber-glow);background:var(--bg-4)}
.interval-widget.is-done{border-color:var(--olive);box-shadow:0 0 14px var(--olive-glow)}
.interval-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.interval-phase{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim)}
.interval-widget.is-work .interval-phase{color:var(--olive)}
.interval-widget.is-rest .interval-phase{color:var(--amber)}
.interval-widget.is-done .interval-phase{color:var(--olive)}
.interval-round{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:1px}
.interval-time{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--text);
  text-align:center;margin:6px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:1px;
}
.interval-widget.is-work .interval-time{color:var(--olive)}
.interval-widget.is-rest .interval-time{color:var(--amber)}
.interval-widget.is-done .interval-time{color:var(--olive);animation:blink 1s infinite}
.interval-progress{height:5px;background:var(--bg-2);border:1px solid var(--border-2);overflow:hidden;margin-bottom:12px}
.interval-progress-fill{height:100%;width:0%;background:var(--olive);transition:width .3s linear}
.interval-widget.is-rest .interval-progress-fill{background:var(--amber)}
.interval-controls{display:flex;gap:8px}
.interval-btn{
  flex:2;padding:10px;background:var(--bg-2);border:1px solid var(--border-bright);color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;
}
.interval-btn:active{transform:scale(.97)}
.interval-btn svg{width:13px;height:13px;flex-shrink:0}
.interval-btn.primary{background:var(--olive);border-color:var(--olive);color:var(--bg)}
.interval-widget.is-rest .interval-btn.primary{background:var(--amber);border-color:var(--amber)}
.interval-btn.ghost{flex:0 0 46px}

/* ============= PROGRESS + RESET ============= */
.progress-block{padding:16px 20px;background:var(--bg-1);border-top:1px solid var(--border)}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.progress-head .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);font-weight:500}
.progress-head .lbl::before{content:'';display:inline-block;width:8px;height:8px;background:var(--olive);margin-right:7px;vertical-align:baseline}
.progress-head .val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;color:var(--olive);letter-spacing:.5px}
.progress-bar{height:6px;background:var(--bg-3);overflow:hidden;border:1px solid var(--border-2);position:relative}
.progress-fill{height:100%;background:var(--olive);transition:width .4s ease;width:0%}

.day-actions{display:flex;gap:8px;margin-top:16px}
.complete-btn{
  flex:1;padding:15px;background:var(--olive);color:var(--bg);font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:15px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .2s;border:1px solid var(--olive);
}
.complete-btn:active{transform:translateY(1px)}
.complete-btn.completed{background:var(--bg-2);color:var(--olive);border-color:var(--olive)}
.complete-btn.completed::before{content:'✓ '}
.reset-day-btn{
  padding:15px 16px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;
}
.reset-day-btn:active{transform:translateY(1px)}
.reset-day-btn svg{width:14px;height:14px;stroke-width:2}
.reset-day-btn.confirming{background:var(--red);border-color:var(--red);color:#fff}

/* ============= REST DAY ============= */
.rest-day{padding:40px 20px;text-align:center}
.rest-day .glyph{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;color:var(--steel);letter-spacing:6px}
.rest-day h3{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;margin:14px 0 8px;text-transform:uppercase;letter-spacing:2px;color:var(--text)}
.rest-day p{font-size:13px;color:var(--text-dim);max-width:300px;margin:0 auto;line-height:1.6;font-family:'Rajdhani',sans-serif;font-weight:500}

/* ============= TOAST ============= */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--olive);color:var(--bg);padding:11px 22px;font-family:'JetBrains Mono',monospace;
  font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:0;pointer-events:none;
  transition:all .3s ease;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============= FOOTER ============= */
.footer{margin-top:24px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dimmer);letter-spacing:1.5px;text-transform:uppercase}
.footer .heart{color:var(--olive);font-weight:700}

@media (max-width:380px){
  .app{padding:14px 12px 80px}
  h1{font-size:32px}
  .card-title{font-size:26px}
  .stat-val{font-size:24px}

  .rest-row .rest-info{font-size:11.5px;gap:8px}
  .rest-row .rest-info svg{width:17px;height:17px}
  .rest-btn{padding:18px 12px;gap:12px}

}

  const today = new Date();
  const tdJsDay = today.getDay();
  let daysSinceMon = (tdJsDay === 0) ? 6 : tdJsDay - 1;
  const mon = new Date(today); mon.setDate(today.getDate() - daysSinceMon);
  const offset = (jsDay === 0) ? 6 : jsDay - 1;
  const d = new Date(mon); d.setDate(mon.getDate() + offset);
  return d;
}

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function renderHeader(){
  const t = new Date();
  document.getElementById('todayLabel').textContent = `TODAY · ${DAYS_SHORT[t.getDay()].toUpperCase()}`;
}

function renderTabs(){
  const container = document.getElementById('dayTabs');
  container.innerHTML = '';
  const todayJsDay = (new Date()).getDay();
  const order = [1,2,3,4,5,6,0];
  order.forEach(jsDay => {
    const plan = SCHEDULE[planKeyFor(jsDay)];
    const d = dateForDayOfWeek(jsDay);
    const isToday = jsDay === todayJsDay;
    const isActive = jsDay === baseDay(activeDay);
    const dk = dateKey(d);
    const isCompleted = !!state.completed[dk];
    const tab = document.createElement('button');
    tab.className = `day-tab ${isActive?'active':''} ${isToday?'today':''} ${isCompleted?'completed':''}`;
    tab.innerHTML = `<div class="dn">${DAYS_SHORT[jsDay]}</div><div class="ico">${ic(plan.icon)}</div><div class="check-dot"></div>`;
    tab.onclick = () => { activeDay = planKeyFor(jsDay); renderTabs(); renderContent(); };
    container.appendChild(tab);
  });
}

function renderStats(){
  let streak = 0;
  const today = new Date();
  let d = new Date(today);
  if(!state.completed[dateKey(d)]) d.setDate(d.getDate()-1);
  while(state.completed[dateKey(d)]){streak++; d.setDate(d.getDate()-1)}
  document.getElementById('streakNum').textContent = streak;

  const todayJsDay = today.getDay();
  let daysSinceMon = (todayJsDay === 0) ? 6 : todayJsDay - 1;
  const mon = new Date(today); mon.setDate(today.getDate() - daysSinceMon);
  let weekDone = 0;
  for(let i=0;i<7;i++){const wd = new Date(mon); wd.setDate(mon.getDate()+i); if(state.completed[dateKey(wd)]) weekDone++}
  document.getElementById('weekDone').textContent = `${weekDone}/7`;
  document.getElementById('totalDays').textContent = Object.keys(state.completed).length;
}

function variantToggleHTML(weekday){
  const onAlt = !!(state.variant && state.variant[weekday]);
  return `<div class="variant-swap">
    <button class="swap-btn ${onAlt?'':'active'}" onclick="setVariant(${weekday},false)">COURT</button>
    <button class="swap-btn ${onAlt?'active':''}" onclick="setVariant(${weekday},true)">${ALT_LABEL[weekday]}</button>
  </div>`;
}

function setVariant(weekday, useAlt){
  if(!state.variant) state.variant = {};
  if(!!state.variant[weekday] === !!useAlt) return;
  state.variant[weekday] = !!useAlt;
  saveState();
  activeDay = planKeyFor(weekday);
  renderTabs();
  renderContent();
  toast(useAlt ? `SWITCHED TO ${ALT_LABEL[weekday]}` : 'SWITCHED TO COURT');
}

function renderContent(){
  const plan = SCHEDULE[activeDay];
  const bd = baseDay(activeDay);
  const d = dateForDayOfWeek(activeDay);
  const dk = dateKey(d);
  const isDone = !!state.completed[dk];
  const isToday = bd === (new Date()).getDay();
  const container = document.getElementById('content');
  const swap = ALT_OF[bd] !== undefined ? variantToggleHTML(bd) : '';

  if(plan.isRest){
    container.innerHTML = `
      <div class="card">
        <div class="card-head" style="--accent:${plan.accent}">
          <div class="card-icon-big">${ic(plan.icon)}</div>
          <div class="card-day-label">${DAYS_FULL[bd].toUpperCase()}${isToday?' <span class="today-tag">NOW</span>':''}</div>
          <div class="card-title">${plan.name}</div>
          <div class="card-focus">${plan.focus}</div>
        </div>
        ${swap}
        <div class="rest-day">
          <div class="glyph">— OFFLINE —</div>
          <h3>Stand Down</h3>
          <p>Recovery is part of the mission. Sleep early, hydrate, and let the body rebuild. Back on duty tomorrow.</p>
        </div>
      </div>`;
    return;
  }

  let totalSets = 0, doneSets = 0;
  plan.phases.forEach((ph,pi)=>ph.exercises.forEach((ex,ei)=>{
    const n = ex.interval ? ex.interval.rounds : (ex.sets||1); totalSets += n;
    for(let si=0;si<n;si++){if(state.sets[`${activeDay}_${pi}_${ei}_${si}`]) doneSets++}
  }));

  let phasesHTML = '<div class="phases">';
  plan.phases.forEach((ph,pi)=>{
    phasesHTML += `<div class="phase"><div class="phase-label ${ph.daily?'daily':''}">${ph.label}<span class="pl-line"></span></div>`;
    ph.exercises.forEach((ex,ei)=>{
      const isInterval = !!ex.interval;
      const n = isInterval ? ex.interval.rounds : (ex.sets||1);
      const isSingle = !isInterval && n === 1;
      const key = `${activeDay}_${pi}_${ei}`;
      const metaLabel = isInterval
        ? `<div class="ex-sets-label"><span class="num">${ex.interval.rounds}</span> ROUNDS ×<br>${ex.interval.work}s/${ex.interval.rest}s</div>`
        : (!isSingle ? `<div class="ex-sets-label"><span class="num">${n}</span> SETS ×<br>${ex.reps}</div>` : '');
      phasesHTML += `<div class="ex"><div class="ex-head"><div><div class="ex-name">${ex.name}</div>${ex.note?`<div class="ex-note">${ex.note}</div>`:''}</div>${metaLabel}</div>`;
      if(isInterval){
        phasesHTML += `<div class="interval-widget" id="interval_${key}">
          <div class="interval-top"><span class="interval-phase" id="iphase_${key}">WORK</span><span class="interval-round" id="iround_${key}">ROUND 1/${ex.interval.rounds}</span></div>
          <div class="interval-time" id="itime_${key}">${ex.interval.work}</div>
          <div class="interval-progress"><div class="interval-progress-fill" id="iprog_${key}"></div></div>
          <div class="interval-controls">
            <button class="interval-btn primary" id="ibtn_${key}" onclick="toggleInterval('${key}')">${ic('play')}<span>START</span></button>
            <button class="interval-btn ghost" onclick="resetIntervalUI('${key}')">${ic('reset')}</button>
          </div>
        </div>`;
      }else if(isSingle){
        const k = `${activeDay}_${pi}_${ei}_0`;
        const done = !!state.sets[k];
        phasesHTML += `<div class="single-row ${done?'done':''}" data-key="${k}" onclick="toggleSet('${k}')"><div class="check"></div><div class="reps-text">${ex.reps}</div></div>`;
      }else{
        phasesHTML += '<div class="sets">';
        for(let si=0;si<n;si++){
          const k = `${activeDay}_${pi}_${ei}_${si}`;
          const done = !!state.sets[k];
          phasesHTML += `<div class="set-row ${done?'done':''}" data-key="${k}" onclick="toggleSet('${k}')"><span class="lbl">SET ${si+1}</span><span class="reps">${ex.reps}</span></div>`;
        }
        phasesHTML += '</div>';
        if(ex.rest){
          const tkey = `${activeDay}_${pi}_${ei}_rest`;
          phasesHTML += `<div class="rest-row" id="restrow_${tkey}"><div class="rest-info">${ic('hourglass')}<span>REST ${ex.rest}s</span></div><button class="rest-btn" id="rest_${tkey}" onclick="toggleRest('${tkey}',${ex.rest})">${ic('play')}<span class="timer-text" id="timer_${tkey}">${ex.rest}s</span></button><div class="rest-progress" id="restprog_${tkey}"></div></div>`;
        }
      }
      phasesHTML += '</div>';
    });
    phasesHTML += '</div>';
  });
  phasesHTML += '</div>';

  const pct = totalSets>0 ? Math.round((doneSets/totalSets)*100) : 0;

  container.innerHTML = `
    <div class="card">
      <div class="card-head" style="--accent:${plan.accent}">
        <div class="card-icon-big">${ic(plan.icon)}</div>
        <div class="card-day-label">${DAYS_FULL[bd].toUpperCase()}${isToday?' <span class="today-tag">NOW</span>':''}</div>
        <div class="card-title">${plan.name}</div>
        <div class="card-focus">${plan.focus}</div>
        <div class="card-meta">
          <span class="chip hl">${ic('clock')} ${plan.duration}</span>
          <span class="chip">${plan.levelText}</span>
          <span class="pillar-tag">${plan.pillar}</span>
        </div>
      </div>
      ${swap}
      ${plan.rationale?`<div class="rationale"><span class="leaf">INTEL</span><div>${plan.rationale}</div></div>`:''}
      ${phasesHTML}
      <div class="progress-block">
        <div class="progress-head"><span class="lbl">Mission Progress</span><span class="val" id="progressText">${doneSets}/${totalSets}</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="day-actions">
      <button class="complete-btn ${isDone?'completed':''}" id="completeBtn" onclick="toggleDayComplete()">${isDone?'OP COMPLETE':'MARK COMPLETE'}</button>
      <button class="reset-day-btn" id="resetDayBtn" onclick="resetDay()">${ic('reset')} RESET</button>
    </div>`;
  syncIntervalWidgets();
}

// ════════════════════════════════════════════════════════════
// INTERACTIONS
// ════════════════════════════════════════════════════════════
function toggleSet(key){
  const wasUndone = !state.sets[key];
  state.sets[key] = !state.sets[key];
  saveState();
  const row = document.querySelector(`[data-key="${key}"]`);
  if(row) row.classList.toggle('done', state.sets[key]);
  updateProgress();
  if(wasUndone){
    const parts = key.split('_');
    const day = parseInt(parts[0]), pi = parseInt(parts[1]), ei = parseInt(parts[2]), si = parseInt(parts[3]);
    const ex = SCHEDULE[day]?.phases?.[pi]?.exercises?.[ei];
    if(ex && ex.rest){
      const n = ex.sets||1;
      const isLast = (si===n-1) && (ei===SCHEDULE[day].phases[pi].exercises.length-1) && (pi===SCHEDULE[day].phases.length-1);
      if(!isLast){
        const tkey = `${day}_${pi}_${ei}_rest`;
        const btn = document.getElementById(`rest_${tkey}`);
        if(btn && !btn.classList.contains('running')) startRest(tkey, ex.rest);
      }
    }
  }
}

function updateProgress(){
  const plan = SCHEDULE[activeDay];
  if(plan.isRest) return;
  let total = 0, done = 0;
  plan.phases.forEach((ph,pi)=>ph.exercises.forEach((ex,ei)=>{
    const n = ex.interval ? ex.interval.rounds : (ex.sets||1); total += n;
    for(let si=0;si<n;si++){if(state.sets[`${activeDay}_${pi}_${ei}_${si}`]) done++}
  }));
  const pct = total>0 ? Math.round((done/total)*100) : 0;
  const pt = document.getElementById('progressText'); if(pt) pt.textContent = `${done}/${total}`;
  const pf = document.getElementById('progressFill'); if(pf) pf.style.width = pct+'%';
}

let pendingComplete = false;
function toggleDayComplete(){
  const d = dateForDayOfWeek(activeDay);
  const dk = dateKey(d);
  if(state.completed[dk]){
    if(!pendingComplete){
      pendingComplete = true;
      const btn = document.getElementById('completeBtn');
      btn.textContent = 'TAP TO UNMARK';
      btn.style.background = 'var(--red)';
      btn.style.borderColor = 'var(--red)';
      btn.style.color = '#fff';
      setTimeout(()=>{if(pendingComplete){pendingComplete=false; renderContent()}},2500);
      return;
    }else{
      delete state.completed[dk];
      pendingComplete = false;
      saveState();
      toast('OP UNMARKED');
    }
  }else{
    state.completed[dk] = true;
    saveState();
    if(stopwatch.running) pauseStopwatch();
    if(manualTimer.running) pauseManualTimer();
    toast('✓ OP COMPLETE · WELL DONE');
  }
  renderTabs(); renderStats(); renderContent();
}

// — DAILY RESET (clears all set checkmarks + completion for the selected day) —
let pendingReset = false;
function resetDay(){
  const btn = document.getElementById('resetDayBtn');
  if(!pendingReset){
    pendingReset = true;
    btn.classList.add('confirming');
    btn.innerHTML = `${ic('reset')} TAP TO CONFIRM`;
    setTimeout(()=>{
      if(pendingReset){
        pendingReset = false;
        btn.classList.remove('confirming');
        btn.innerHTML = `${ic('reset')} RESET`;
      }
    },2500);
    return;
  }
  // Confirmed — clear sets for this day + completion mark
  pendingReset = false;
  // Stop any running rest timer on this day
  if(activeTimer && activeTimer.key.startsWith(`${activeDay}_`)){
    clearInterval(activeTimer.interval);
    activeTimer = null;
  }
  // Stop and clear any interval-timer runners (e.g. Jump Rope Sprints) on this day
  Object.keys(intervalRunners).forEach(key=>{
    if(key.startsWith(`${activeDay}_`)){
      clearIntervalTimer(key);
      delete intervalRunners[key];
    }
  });
  // Remove all set keys that belong to this day
  Object.keys(state.sets).forEach(k=>{
    if(k.startsWith(`${activeDay}_`)) delete state.sets[k];
  });
  // Remove completion mark for this calendar date
  const dk = dateKey(dateForDayOfWeek(activeDay));
  delete state.completed[dk];
  saveState();
  renderTabs(); renderStats(); renderContent();
  toast('DAY RESET');
}

// ════════════════════════════════════════════════════════════
// REST TIMER
// ════════════════════════════════════════════════════════════
function toggleRest(tkey, seconds){
  if(activeTimer && activeTimer.key === tkey) stopRest(tkey, seconds);
  else startRest(tkey, seconds);
}
function startRest(tkey, seconds){
  if(activeTimer){
    const oldKey = activeTimer.key, oldTotal = activeTimer.total;
    const oldBtn = document.getElementById(`rest_${oldKey}`);
    const oldRow = document.getElementById(`restrow_${oldKey}`);
    const oldProg = document.getElementById(`restprog_${oldKey}`);
    clearInterval(activeTimer.interval);
    if(oldBtn){oldBtn.classList.remove('running'); oldBtn.innerHTML = `${ic('play')}<span class="timer-text" id="timer_${oldKey}">${oldTotal}s</span>`}
    if(oldRow) oldRow.classList.remove('is-running','is-done');
    if(oldProg) oldProg.style.width = '0%';
  }
  const btn = document.getElementById(`rest_${tkey}`);
  const row = document.getElementById(`restrow_${tkey}`);
  const prog = document.getElementById(`restprog_${tkey}`);
  if(!btn) return;
  let remaining = seconds;
  btn.classList.remove('done'); btn.classList.add('running');
  btn.innerHTML = `${ic('pause')}<span class="timer-text" id="timer_${tkey}">${remaining}s</span>`;
  if(row){row.classList.remove('is-done'); row.classList.add('is-running')}
  if(prog) prog.style.width = '0%';
  activeTimer = {key:tkey, total:seconds, remaining};
  activeTimer.interval = setInterval(()=>{
    remaining--; activeTimer.remaining = remaining;
    const t = document.getElementById(`timer_${tkey}`); if(t) t.textContent = `${remaining}s`;
    const p = document.getElementById(`restprog_${tkey}`); if(p) p.style.width = (((seconds-remaining)/seconds)*100)+'%';
    if(remaining <= 0){
      clearInterval(activeTimer.interval); activeTimer = null;
      if(btn){btn.classList.remove('running'); btn.classList.add('done'); btn.innerHTML = `<span style="font-weight:700;font-size:34px;line-height:.9">✓</span><span class="timer-text">DONE</span>`}
      if(row){row.classList.remove('is-running'); row.classList.add('is-done')}
      if(navigator.vibrate) navigator.vibrate([100,50,100]);
      setTimeout(()=>{
        if(btn && !btn.classList.contains('running')){btn.classList.remove('done'); btn.innerHTML = `${ic('play')}<span class="timer-text" id="timer_${tkey}">${seconds}s</span>`}
        if(row) row.classList.remove('is-done');
        const p2 = document.getElementById(`restprog_${tkey}`); if(p2) p2.style.width = '0%';
      },4000);
      toast('REST OVER — NEXT SET');
    }
  },1000);
}
function stopRest(tkey, seconds){
  if(!activeTimer || activeTimer.key !== tkey) return;
  clearInterval(activeTimer.interval); activeTimer = null;
  const btn = document.getElementById(`rest_${tkey}`);
  const row = document.getElementById(`restrow_${tkey}`);
  const prog = document.getElementById(`restprog_${tkey}`);
  if(btn){btn.classList.remove('running'); btn.innerHTML = `${ic('play')}<span class="timer-text" id="timer_${tkey}">${seconds}s</span>`}
  if(row) row.classList.remove('is-running','is-done');
  if(prog) prog.style.width = '0%';
}

// ════════════════════════════════════════════════════════════
// INTERVAL TIMER — auto-cycling work/rest rounds (e.g. Jump Rope Sprints)
// ════════════════════════════════════════════════════════════
let intervalRunners = {};

function getIntervalCfg(key){
  const parts = key.split('_');
  const day = parseInt(parts[0]), pi = parseInt(parts[1]), ei = parseInt(parts[2]);
  return SCHEDULE[day]?.phases?.[pi]?.exercises?.[ei]?.interval;
}

function toggleInterval(key){
  const runner = intervalRunners[key];
  if(runner && runner.running) pauseInterval(key);
  else startInterval(key);
}

function startInterval(key){
  const cfg = getIntervalCfg(key);
  if(!cfg) return;
  let runner = intervalRunners[key];
  if(!runner || runner.finished){
    runner = intervalRunners[key] = {phase:'work', round:1, remaining:cfg.work, running:false, finished:false, timerId:null};
  }
  runner.running = true;
  clearIntervalTimer(key);
  runner.timerId = setInterval(()=>advanceInterval(key), 1000);
  renderIntervalUI(key);
}

function pauseInterval(key){
  const runner = intervalRunners[key];
  if(!runner) return;
  runner.running = false;
  clearIntervalTimer(key);
  renderIntervalUI(key);
}

function clearIntervalTimer(key){
  const runner = intervalRunners[key];
  if(runner && runner.timerId){clearInterval(runner.timerId); runner.timerId = null}
}

function resetIntervalUI(key){
  const cfg = getIntervalCfg(key);
  if(!cfg) return;
  clearIntervalTimer(key);
  intervalRunners[key] = {phase:'work', round:1, remaining:cfg.work, running:false, finished:false, timerId:null};
  for(let r=0;r<cfg.rounds;r++){ delete state.sets[`${key}_${r}`]; }
  saveState();
  updateProgress();
  renderIntervalUI(key);
  toast('INTERVAL RESET');
}

function advanceInterval(key){
  const runner = intervalRunners[key];
  const cfg = getIntervalCfg(key);
  if(!runner || !cfg) return;
  runner.remaining--;
  if(runner.remaining <= 0){
    if(runner.phase === 'work'){
      state.sets[`${key}_${runner.round-1}`] = true;
      saveState();
      updateProgress();
      if(navigator.vibrate) navigator.vibrate([100,50,100]);
      if(runner.round >= cfg.rounds){
        clearIntervalTimer(key);
        runner.running = false;
        runner.finished = true;
        toast('✓ INTERVAL COMPLETE');
        renderIntervalUI(key);
        return;
      }
      runner.phase = 'rest';
      runner.remaining = cfg.rest;
    }else{
      runner.round++;
      runner.phase = 'work';
      runner.remaining = cfg.work;
      if(navigator.vibrate) navigator.vibrate(80);
      toast(`ROUND ${runner.round}/${cfg.rounds}`);
    }
  }
  renderIntervalUI(key);
}

function renderIntervalUI(key){
  const runner = intervalRunners[key];
  const cfg = getIntervalCfg(key);
  if(!runner || !cfg) return;
  const widget = document.getElementById(`interval_${key}`);
  if(!widget) return; // not on the currently displayed day
  const phaseEl = document.getElementById(`iphase_${key}`);
  const roundEl = document.getElementById(`iround_${key}`);
  const timeEl = document.getElementById(`itime_${key}`);
  const progEl = document.getElementById(`iprog_${key}`);
  const btnEl = document.getElementById(`ibtn_${key}`);

  widget.classList.remove('is-work','is-rest','is-done');
  if(runner.finished){
    widget.classList.add('is-done');
    phaseEl.textContent = 'COMPLETE';
    roundEl.textContent = `${cfg.rounds}/${cfg.rounds} DONE`;
    timeEl.textContent = '00';
    progEl.style.width = '100%';
    btnEl.innerHTML = `${ic('play')}<span>RESTART</span>`;
    return;
  }
  widget.classList.add(runner.phase === 'work' ? 'is-work' : 'is-rest');
  phaseEl.textContent = runner.phase === 'work' ? 'WORK' : 'REST';
  roundEl.textContent = `ROUND ${runner.round}/${cfg.rounds}`;
  timeEl.textContent = String(runner.remaining).padStart(2,'0');
  const total = runner.phase === 'work' ? cfg.work : cfg.rest;
  progEl.style.width = (((total - runner.remaining) / total) * 100) + '%';
  const label = runner.running ? 'PAUSE' : ((runner.round>1||runner.phase==='rest') ? 'RESUME' : 'START');
  btnEl.innerHTML = `${runner.running ? ic('pause') : ic('play')}<span>${label}</span>`;
}

function syncIntervalWidgets(){
  Object.keys(intervalRunners).forEach(key=>{
    if(document.getElementById(`interval_${key}`)) renderIntervalUI(key);
  });
}

// ════════════════════════════════════════════════════════════
// SESSION TIMER — Dual mode
// ════════════════════════════════════════════════════════════
let timerMode = localStorage.getItem('leon_timer_mode') || 'stopwatch';
let stopwatch = loadStopwatch();
let manualTimer = loadManualTimer();
let tickInterval = null;

function loadStopwatch(){
  try{
    const s = JSON.parse(localStorage.getItem('leon_stopwatch') || '{}');
    if(s.running && s.startTimestamp){
      const now = Date.now();
      if(new Date(s.startTimestamp).toDateString() !== new Date().toDateString()) return {elapsed:0, running:false, startTimestamp:null};
      return {elapsed:s.elapsed+(now-s.startTimestamp), running:true, startTimestamp:now};
    }
    return {elapsed:s.elapsed||0, running:false, startTimestamp:null};
  }catch(e){return {elapsed:0, running:false, startTimestamp:null}}
}
function loadManualTimer(){
  try{
    const s = JSON.parse(localStorage.getItem('leon_manual_timer') || '{}');
    return {duration:s.duration||60, elapsedBefore:0, running:false, startTimestamp:null, finished:false};
  }catch(e){return {duration:60, elapsedBefore:0, running:false, startTimestamp:null, finished:false}}
}
function saveStopwatch(){localStorage.setItem('leon_stopwatch', JSON.stringify(stopwatch))}
function saveManualTimer(){localStorage.setItem('leon_manual_timer', JSON.stringify({duration:manualTimer.duration}))}

function fmtTime(ms){
  const total = Math.floor(ms/1000);
  const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  const pad = n=>String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function getActiveTimer(){return timerMode === 'stopwatch' ? stopwatch : manualTimer}

function renderTimerBar(){
  const bar = document.getElementById('sessionBar');
  const timeEl = document.getElementById('swTime');
  const labelEl = document.getElementById('swLabel');
  const playBtn = document.getElementById('swPlayBtn');
  if(!timeEl) return;
  const active = getActiveTimer();
  bar.classList.toggle('running', active.running);
  bar.classList.toggle('timer-mode', timerMode === 'timer');
  bar.classList.toggle('timer-finished', timerMode === 'timer' && manualTimer.finished);
  document.getElementById('modeStopwatchBtn').classList.toggle('active', timerMode === 'stopwatch');
  document.getElementById('modeTimerBtn').classList.toggle('active', timerMode === 'timer');

  if(timerMode === 'stopwatch'){
    labelEl.textContent = 'SESSION TIME';
    let elapsed = stopwatch.elapsed;
    if(stopwatch.running && stopwatch.startTimestamp) elapsed = stopwatch.elapsed + (Date.now()-stopwatch.startTimestamp);
    timeEl.textContent = fmtTime(elapsed);
  }else{
    labelEl.textContent = manualTimer.finished ? 'COMPLETE' : 'COUNTDOWN';
    let remaining = manualTimer.duration - manualTimer.elapsedBefore;
    if(manualTimer.running && manualTimer.startTimestamp) remaining = manualTimer.duration - manualTimer.elapsedBefore - (Date.now()-manualTimer.startTimestamp)/1000;
    remaining = Math.max(0, Math.ceil(remaining));
    timeEl.textContent = fmtTime(remaining*1000);
    document.querySelectorAll('.preset-btn').forEach(btn=>btn.classList.toggle('active', parseInt(btn.dataset.sec)===manualTimer.duration));
  }
  playBtn.innerHTML = active.running ? ic('pause') : ic('play');
}

function switchMode(mode){
  if(timerMode === mode) return;
  timerMode = mode;
  localStorage.setItem('leon_timer_mode', mode);
  ensureTicker(); renderTimerBar();
}
function ensureTicker(){
  const need = stopwatch.running || manualTimer.running;
  if(need && !tickInterval) tickInterval = setInterval(tick, 250);
  else if(!need && tickInterval){clearInterval(tickInterval); tickInterval = null}
}
function tick(){
  if(manualTimer.running && manualTimer.startTimestamp){
    if(manualTimer.elapsedBefore + (Date.now()-manualTimer.startTimestamp)/1000 >= manualTimer.duration){finishManualTimer(); return}
  }
  renderTimerBar();
}
function startStopwatch(){if(stopwatch.running) return; stopwatch.running=true; stopwatch.startTimestamp=Date.now(); saveStopwatch(); ensureTicker(); renderTimerBar()}
function pauseStopwatch(){if(!stopwatch.running) return; stopwatch.elapsed+=Date.now()-stopwatch.startTimestamp; stopwatch.running=false; stopwatch.startTimestamp=null; saveStopwatch(); ensureTicker(); renderTimerBar()}
function resetStopwatch(){if(stopwatch.running){if(tickInterval)clearInterval(tickInterval); tickInterval=null} stopwatch={elapsed:0,running:false,startTimestamp:null}; saveStopwatch(); ensureTicker(); renderTimerBar()}

function setTimerDuration(seconds){if(manualTimer.running) pauseManualTimer(); manualTimer.duration=seconds; manualTimer.elapsedBefore=0; manualTimer.finished=false; saveManualTimer(); renderTimerBar()}
function startManualTimer(){
  if(manualTimer.running) return;
  if(manualTimer.finished || manualTimer.elapsedBefore>=manualTimer.duration){manualTimer.elapsedBefore=0; manualTimer.finished=false}
  manualTimer.running=true; manualTimer.startTimestamp=Date.now(); ensureTicker(); renderTimerBar();
}
function pauseManualTimer(){if(!manualTimer.running) return; manualTimer.elapsedBefore+=(Date.now()-manualTimer.startTimestamp)/1000; manualTimer.running=false; manualTimer.startTimestamp=null; ensureTicker(); renderTimerBar()}
function finishManualTimer(){
  manualTimer.running=false; manualTimer.startTimestamp=null; manualTimer.elapsedBefore=manualTimer.duration; manualTimer.finished=true;
  ensureTicker(); renderTimerBar();
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,400]);
  toast('TIMER COMPLETE');
}
function resetManualTimer(){if(manualTimer.running){clearInterval(tickInterval); tickInterval=null; manualTimer.running=false; manualTimer.startTimestamp=null} manualTimer.elapsedBefore=0; manualTimer.finished=false; ensureTicker(); renderTimerBar()}

function toggleActive(){
  if(timerMode === 'stopwatch'){stopwatch.running ? pauseStopwatch() : startStopwatch()}
  else{manualTimer.running ? pauseManualTimer() : startManualTimer()}
}
function resetActive(){
  const btn = document.getElementById('swResetBtn');
  if(btn.dataset.confirming){
    delete btn.dataset.confirming; btn.style.background=''; btn.style.borderColor='';
    if(timerMode === 'stopwatch') resetStopwatch(); else resetManualTimer();
    toast('RESET'); return;
  }
  btn.dataset.confirming = '1';
  btn.style.background = 'var(--red)'; btn.style.borderColor = 'var(--red)';
  setTimeout(()=>{if(btn.dataset.confirming){delete btn.dataset.confirming; btn.style.background=''; btn.style.borderColor=''}},2000);
  toast('TAP AGAIN TO RESET');
}

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
renderHeader();
renderStats();
renderTabs();
renderContent();
renderTimerBar();
document.querySelector('.sw-btn.ghost').innerHTML = ic('reset');
ensureTicker();
</script>
