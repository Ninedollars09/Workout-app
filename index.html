<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYMNET">
<meta name="theme-color" content="#07070b">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2307070b'/><rect x='6' y='6' width='88' height='88' fill='none' stroke='%23fcee0a' stroke-width='3'/><text x='50' y='44' font-family='Arial Black,sans-serif' font-size='28' font-weight='900' fill='%23fcee0a' text-anchor='middle' letter-spacing='2'>GYM</text><text x='50' y='72' font-family='Arial,monospace' font-size='14' font-weight='700' fill='%2300f0ff' text-anchor='middle' letter-spacing='3'>//NET</text></svg>">
<title>GYMNET // TRAINING PROTOCOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #07070b;
  --bg-1: #0d0d14;
  --bg-2: #14141e;
  --bg-3: #1c1c2a;
  --bg-4: #25253a;
  --border: #2a2a3e;
  --border-2: #3a3a52;
  --border-bright: #4a4a6a;
  --text: #e8e8f5;
  --text-dim: #9090a8;
  --text-dimmer: #5a5a72;
  --yellow: #fcee0a;
  --yellow-dark: #c2b610;
  --yellow-glow: rgba(252,238,10,.4);
  --cyan: #00f0ff;
  --cyan-dark: #00a8c4;
  --cyan-glow: rgba(0,240,255,.35);
  --magenta: #ff003c;
  --magenta-2: #ff2070;
  --magenta-glow: rgba(255,0,60,.4);
  --done: #00ff88;
  --done-glow: rgba(0,255,136,.3);
  --warn: #ff8800;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

@keyframes glitch-slide{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-1px)}
  40%{transform:translateX(1px)}
  60%{transform:translateX(-.5px)}
  80%{transform:translateX(.5px)}
}
@keyframes flicker{
  0%,100%{opacity:1}
  41%,43%{opacity:.92}
  42%{opacity:.4}
  62%,64%{opacity:.95}
  63%{opacity:.55}
}
@keyframes pulse-glow{
  0%,100%{box-shadow:0 0 0 0 var(--yellow-glow), 0 0 12px var(--yellow-glow)}
  50%{box-shadow:0 0 0 4px transparent, 0 0 24px var(--yellow-glow)}
}
@keyframes scan{
  0%{transform:translateY(-100%)}
  100%{transform:translateY(100vh)}
}
@keyframes pulse-dot{
  0%,100%{opacity:1;box-shadow:0 0 8px var(--yellow)}
  50%{opacity:.4;box-shadow:0 0 2px var(--yellow)}
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:'Kanit','Sarabun',-apple-system,sans-serif;
  font-weight:400;line-height:1.5;
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
body{
  background:
    radial-gradient(800px 400px at 80% 0%, rgba(252,238,10,.06) 0%, transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(0,240,255,.05) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-1) 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left);
  position:relative;
  overflow-x:hidden;
}
/* CRT scanline grid */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image:
    linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image:radial-gradient(ellipse at center, rgba(0,0,0,.8), transparent 80%);
}
/* Scanline overlay */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(0,0,0,.06) 2px, rgba(0,0,0,.06) 3px);
  opacity:.5;
}

.tech{font-family:'Orbitron',-apple-system,sans-serif;font-weight:700;letter-spacing:1.5px}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:520px;margin:0 auto;padding:18px 18px 80px;position:relative;z-index:3}

/* ============= HEADER ============= */
.header{padding:8px 4px 18px;position:relative}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--cyan);font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.eyebrow .dot{display:inline-block;width:6px;height:6px;background:var(--yellow);border-radius:50%;animation:pulse-dot 1.6s ease-in-out infinite}
.eyebrow .bracket{color:var(--text-dimmer)}
.eyebrow .id{color:var(--text-dim)}

h1{
  font-family:'Orbitron',sans-serif;
  font-size:30px;font-weight:800;line-height:1;letter-spacing:1px;
  margin-top:10px;text-transform:uppercase;
  background:linear-gradient(180deg,var(--text) 0%,var(--text-dim) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1 .accent{
  color:var(--yellow);background:none;-webkit-text-fill-color:var(--yellow);
  text-shadow:0 0 20px var(--yellow-glow), 0 0 4px var(--yellow-glow);
  font-style:italic;font-weight:900;
}
.tagline{
  color:var(--text-dim);font-size:11.5px;margin-top:8px;
  font-family:'JetBrains Mono',monospace;letter-spacing:.3px;
  display:flex;align-items:center;gap:8px;
}
.tagline::before{content:'>>';color:var(--yellow);font-weight:700}

/* ============= STREAK STRIP ============= */
.streak-strip{
  display:flex;gap:0;margin:20px 0 16px;
  background:var(--bg-2);
  border:1px solid var(--border);
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  position:relative;
}
.streak-strip::before{
  content:'';position:absolute;top:0;left:0;width:3px;height:24px;
  background:var(--yellow);box-shadow:0 0 8px var(--yellow-glow);
}
.stat{flex:1;text-align:center;padding:14px 8px;position:relative}
.stat + .stat::before{
  content:'';position:absolute;left:0;top:20%;height:60%;width:1px;
  background:var(--border);
}
.stat-val{
  font-family:'Orbitron',sans-serif;font-size:24px;font-weight:800;
  color:var(--text);line-height:1;letter-spacing:.5px;
}
.stat-val.coral{color:var(--yellow);text-shadow:0 0 10px var(--yellow-glow)}
.stat-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--text-dim);margin-top:6px;font-weight:600;
}

/* ============= SESSION BAR (Stopwatch + Timer) ============= */
.session-bar{
  padding:10px 14px 12px;margin-bottom:14px;
  background:var(--bg-2);
  border:1px solid var(--border);border-left:3px solid var(--cyan);
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  position:sticky;top:8px;z-index:50;
  transition:all .2s;
}
.session-bar.running{
  background:linear-gradient(135deg,#1a1a0a 0%,#0a0a14 100%);
  border-color:var(--yellow);border-left-color:var(--yellow);
  box-shadow:0 0 24px rgba(252,238,10,.15);
}
.session-bar.timer-mode{border-left-color:var(--magenta)}
.session-bar.timer-mode.running{
  border-color:var(--magenta);border-left-color:var(--magenta);
  box-shadow:0 0 24px var(--magenta-glow);
  background:linear-gradient(135deg,#1a0a14 0%,#0a0a14 100%);
}

.mode-tabs{
  display:flex;gap:0;margin-bottom:10px;
  border-bottom:1px solid var(--border);
}
.mode-tab{
  flex:1;padding:6px 4px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:1.8px;font-weight:700;text-transform:uppercase;
  color:var(--text-dim);
  background:transparent;border:none;border-bottom:2px solid transparent;
  transition:all .15s;cursor:pointer;
}
.mode-tab.active{color:var(--yellow);border-bottom-color:var(--yellow);text-shadow:0 0 8px var(--yellow-glow)}
.session-bar.timer-mode .mode-tab.active{color:var(--magenta);border-bottom-color:var(--magenta);text-shadow:0 0 8px var(--magenta-glow)}

.sw-row{display:flex;align-items:center;justify-content:space-between}
.sw-left{display:flex;flex-direction:column;gap:2px}
.sw-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--text-dim);font-weight:600;
}
.session-bar.running .sw-label{color:var(--yellow);animation:flicker 4s infinite}
.session-bar.timer-mode.running .sw-label{color:var(--magenta)}
.sw-time{
  font-family:'Orbitron',sans-serif;font-weight:700;
  font-size:24px;line-height:1;letter-spacing:1px;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.session-bar.running .sw-time{color:var(--yellow);text-shadow:0 0 12px var(--yellow-glow)}
.session-bar.timer-mode.running .sw-time{color:var(--magenta);text-shadow:0 0 14px var(--magenta-glow)}
.session-bar.timer-finished .sw-time{color:var(--done);text-shadow:0 0 14px var(--done-glow);animation:flicker 1s infinite}

.sw-controls{display:flex;gap:8px}
.sw-btn{
  width:36px;height:36px;border-radius:0;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border-2);background:var(--bg-3);
  transition:all .15s;
  clip-path:polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
}
.sw-btn:active{transform:scale(.92)}
.sw-btn svg{width:13px;height:13px;color:var(--text)}
.sw-btn.primary{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 12px var(--yellow-glow)}
.sw-btn.primary svg{color:var(--bg)}
.session-bar.timer-mode .sw-btn.primary{background:var(--magenta);border-color:var(--magenta);box-shadow:0 0 12px var(--magenta-glow)}
.session-bar.running .sw-btn.primary{background:var(--bg);border-color:var(--yellow)}
.session-bar.running .sw-btn.primary svg{color:var(--yellow)}
.session-bar.timer-mode.running .sw-btn.primary{background:var(--bg);border-color:var(--magenta)}
.session-bar.timer-mode.running .sw-btn.primary svg{color:var(--magenta)}

/* Timer presets */
.timer-presets{
  display:none;gap:5px;margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--border);
}
.session-bar.timer-mode .timer-presets{display:flex;flex-wrap:wrap}
.preset-btn{
  flex:1;min-width:50px;padding:6px 4px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:.5px;
  background:var(--bg-3);border:1px solid var(--border-2);color:var(--text);
  cursor:pointer;transition:all .15s;
  clip-path:polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px));
}
.preset-btn:active{transform:scale(.94)}
.preset-btn.active{
  background:var(--magenta);border-color:var(--magenta);color:var(--text);
  box-shadow:0 0 10px var(--magenta-glow);
}

/* ============= DAY TABS ============= */
.day-tabs{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;padding:2px}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex:1;min-width:54px;padding:9px 4px;
  background:var(--bg-2);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:all .2s ease;position:relative;
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
}
.day-tab.active{
  background:var(--yellow);border-color:var(--yellow);
  box-shadow:0 0 16px var(--yellow-glow);
}
.day-tab.active .dn, .day-tab.active .dnum{color:var(--bg)}
.day-tab.active .ico svg{color:var(--bg)}
.day-tab.today:not(.active){
  border-color:var(--cyan);
  box-shadow:inset 0 0 0 1px var(--cyan), 0 0 8px var(--cyan-glow);
}
.day-tab.today:not(.active) .dn{color:var(--cyan)}
.day-tab.today:not(.active) .ico svg{color:var(--cyan)}
.dn{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
  color:var(--text-dim);
}
.dnum{
  font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;
  color:var(--text);letter-spacing:.5px;
}
.day-tab .ico{margin-top:1px}
.day-tab .ico svg{width:17px;height:17px;stroke-width:1.8;color:var(--text-dim)}
.day-tab .check-dot{
  position:absolute;top:5px;right:5px;width:6px;height:6px;
  background:var(--done);box-shadow:0 0 6px var(--done-glow);display:none;
}
.day-tab.completed .check-dot{display:block}
.day-tab.active.completed .check-dot{background:var(--bg)}

/* ============= WORKOUT CARD ============= */
.card{
  background:var(--bg-2);
  border:1px solid var(--border);
  position:relative;
  clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
}
/* Yellow caution stripe corner */
.card::before{
  content:'';position:absolute;top:0;right:0;width:80px;height:3px;
  background:repeating-linear-gradient(90deg, var(--yellow) 0, var(--yellow) 8px, var(--bg) 8px, var(--bg) 14px);
  z-index:2;
}
.card-head{
  padding:22px 22px 18px;
  border-bottom:1px solid var(--border);
  position:relative;background:var(--bg-2);
}
.card-icon-big{
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;background:var(--accent,var(--yellow));position:relative;
  clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  box-shadow:0 0 18px var(--accent-glow,var(--yellow-glow));
}
.card-icon-big svg{width:24px;height:24px;color:var(--bg);stroke-width:2}

.card-day-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--cyan);font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.card-day-label::before{content:'//';color:var(--text-dimmer)}
.card-day-label .today-tag{
  margin-left:6px;padding:1px 6px;background:var(--magenta);color:var(--text);
  font-size:8.5px;letter-spacing:1.5px;
}
.card-title{
  font-family:'Orbitron',sans-serif;font-size:26px;font-weight:800;line-height:1.05;
  margin-top:6px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--text);
}
.card-focus{
  font-size:12.5px;color:var(--text-dim);margin-top:6px;font-weight:300;
  font-family:'JetBrains Mono',monospace;letter-spacing:.2px;
}
.card-focus::before{content:'> ';color:var(--yellow)}

.card-meta{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  background:var(--bg-3);color:var(--text-dim);border:1px solid var(--border-2);
  clip-path:polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
}
.chip.coral{
  background:var(--yellow);color:var(--bg);border-color:var(--yellow);
  box-shadow:0 0 10px var(--yellow-glow);
}
.chip svg{width:10px;height:10px;stroke-width:2.2}

.rationale{
  padding:13px 22px;background:var(--bg-1);
  border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text-dim);line-height:1.55;
  display:flex;gap:10px;align-items:flex-start;
  font-family:'Kanit',sans-serif;font-weight:300;
  position:relative;
}
.rationale::before{
  content:'';position:absolute;left:0;top:0;height:100%;width:3px;
  background:var(--magenta);box-shadow:0 0 8px var(--magenta-glow);
}
.rationale .leaf{
  font-family:'Orbitron',sans-serif;font-weight:800;color:var(--magenta);
  font-size:13px;line-height:1.2;flex-shrink:0;letter-spacing:1px;
}

/* ============= PHASE / EXERCISE ============= */
.phases{padding:6px 0}
.phase{padding:14px 22px 6px}
.phase + .phase{border-top:1px solid var(--border);margin-top:6px;padding-top:16px}
.phase-label{
  font-family:'Orbitron',sans-serif;
  font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--yellow);font-weight:800;
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  text-shadow:0 0 8px var(--yellow-glow);
}
.phase-label::before{content:'▸';color:var(--yellow);font-weight:400;text-shadow:0 0 8px var(--yellow-glow)}
.phase-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--yellow) 0%, transparent 80%);opacity:.4}

.ex{padding:12px 0;border-bottom:1px dashed var(--border)}
.ex:last-child{border-bottom:none}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-weight:600;font-size:14.5px;color:var(--text);line-height:1.25;font-family:'Kanit',sans-serif}
.ex-note{
  font-size:11px;color:var(--text-dim);margin-top:3px;line-height:1.4;
  font-family:'JetBrains Mono',monospace;font-weight:400;
}
.ex-note::before{content:'// ';color:var(--cyan);opacity:.6}
.ex-sets-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--text-dim);text-align:right;font-weight:600;
  letter-spacing:.5px;white-space:nowrap;
}
.ex-sets-label .num{
  font-family:'Orbitron',sans-serif;font-size:16px;color:var(--yellow);
  font-weight:800;text-shadow:0 0 6px var(--yellow-glow);
}

.sets{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.set-row{
  flex:1;min-width:62px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 6px;background:var(--bg-3);border:1px solid var(--border-2);
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;color:var(--text);transition:all .15s;font-weight:700;
  cursor:pointer;user-select:none;letter-spacing:.5px;
  clip-path:polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
}
.set-row .lbl{font-size:9px;letter-spacing:1.2px;color:var(--text-dim)}
.set-row .reps{font-weight:700}
.set-row.done{
  background:var(--done);border-color:var(--done);color:var(--bg);
  box-shadow:0 0 12px var(--done-glow);
}
.set-row.done .lbl{color:var(--bg);opacity:.8}
.set-row.done::before{content:'✓';margin-right:2px;font-weight:800}

.single-row{
  margin-top:10px;display:flex;align-items:center;gap:10px;
  padding:11px 14px;background:var(--bg-3);border:1px solid var(--border-2);
  cursor:pointer;user-select:none;
  clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  transition:all .15s;
}
.single-row .check{
  width:18px;height:18px;border:2px solid var(--text-dim);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  clip-path:polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px));
}
.single-row.done{background:var(--done);border-color:var(--done);color:var(--bg);box-shadow:0 0 12px var(--done-glow)}
.single-row.done .check{background:var(--bg);border-color:var(--bg)}
.single-row.done .check::after{content:'✓';color:var(--done);font-size:12px;font-weight:800}
.single-row .reps-text{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;font-weight:700;color:var(--text);letter-spacing:.3px;
}
.single-row.done .reps-text{color:var(--bg)}

/* Rest timer */
.rest-row{
  margin-top:8px;display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;background:transparent;
  font-size:10.5px;color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;letter-spacing:.3px;
}
.rest-row .rest-info{display:flex;align-items:center;gap:6px}

// STATE

const STORAGE_KEY = "workout_v2_state";
let state = loadState();
let activeDay = (new Date()).getDay(); // today
let activeTimer = null; // {key, interval, remaining, total}

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return {
      sets: s.sets || {},          // key: dayKey_phaseIdx_exIdx_setIdx -> bool
      completed: s.completed || {}, // dateKey -> true
      ...s
    };
  }catch(e){
    return {sets:{}, completed:{}};
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayKey(){return dateKey(new Date())}

// ════════════════════════════════════════════════════════════
// PRE-MARK Monday & Tuesday as done (current week, since user already did them)
// ════════════════════════════════════════════════════════════
function preMarkThisWeek(){
  const today = new Date();
  const jsDay = today.getDay(); // 0=Sun
  // Find this week's Monday and Tuesday
  // Mon offset from today: 1 - jsDay (if jsDay==0 (Sun), Mon was 6 days ago, but we want THIS week)
  // Use ISO week: Mon=1...Sun=7. We treat Mon as start of week.
  let daysSinceMon = (jsDay === 0) ? 6 : jsDay - 1;
  const mon = new Date(today); mon.setDate(today.getDate() - daysSinceMon);
  const tue = new Date(today); tue.setDate(today.getDate() - daysSinceMon + 1);
  // Only mark if not already marked AND if those days have passed (or are today)
  const monK = dateKey(mon);
  const tueK = dateKey(tue);
  if(!state.completed[monK] && mon <= today){
    state.completed[monK] = true;
    state._preMarked = state._preMarked || {};
    state._preMarked[monK] = true;
  }
  if(!state.completed[tueK] && tue <= today){
    state.completed[tueK] = true;
    state._preMarked = state._preMarked || {};
    state._preMarked[tueK] = true;
  }
  saveState();
}

// Run pre-mark once per install
if(!state._preMarkedInit){
  preMarkThisWeek();
  state._preMarkedInit = true;
  saveState();
}

const THAI_MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function renderHeader(){
  const t = new Date();
  const txt = `${DAYS_FULL[t.getDay()].toUpperCase()} · ${THAI_MONTHS[t.getMonth()]} ${t.getDate()}`;
  document.getElementById('todayDate').textContent = txt;
}

function dateForDayOfWeek(jsDay){
  // Returns Date object for the given jsDay (0=Sun..6=Sat) in current week (Mon-start week)
  const today = new Date();
  const tdJsDay = today.getDay();
  let daysSinceMon = (tdJsDay === 0) ? 6 : tdJsDay - 1;
  const mon = new Date(today); mon.setDate(today.getDate() - daysSinceMon);
  const offset = (jsDay === 0) ? 6 : jsDay - 1; // days from Monday
  const d = new Date(mon); d.setDate(mon.getDate() + offset);
  return d;
}

  const todayJsDay = today.getDay();
  // Display order: Mon, Tue, Wed, Thu, Fri, Sat, Sun
  const order = [1,2,3,4,5,6,0];
  order.forEach(jsDay => {
    const plan = SCHEDULE[jsDay];
    const d = dateForDayOfWeek(jsDay);
    const isToday = jsDay === todayJsDay;
    const isActive = jsDay === activeDay;
    const dk = dateKey(d);
    const isCompleted = !!state.completed[dk];
    const tab = document.createElement('button');
    tab.className = `day-tab ${isActive?'active':''} ${isToday?'today':''} ${isCompleted?'completed':''}`;
    tab.innerHTML = `
      <div class="dn">${DAYS_SHORT[jsDay]}</div>
      <div class="dnum">${d.getDate()}</div>
      <div class="ico">${ic(plan.icon)}</div>
      <div class="check-dot"></div>
    `;
    tab.onclick = () => { activeDay = jsDay; renderTabs(); renderContent(); };
    container.appendChild(tab);
  });
}

function renderStreakStrip(){
  // Streak: consecutive days ending today (or yesterday if today not done)
  let streak = 0;
  const today = new Date();
  let d = new Date(today);
  // Don't break streak if today isn't done yet — look back from yesterday
  if(!state.completed[dateKey(d)]) d.setDate(d.getDate()-1);
  while(state.completed[dateKey(d)]){
    streak++;
    d.setDate(d.getDate()-1);
  }
  document.getElementById('streakNum').textContent = streak;

  // This week's done count (Mon-Sun), exclude Sunday rest day from denominator
  const todayJsDay = today.getDay();
  let daysSinceMon = (todayJsDay === 0) ? 6 : todayJsDay - 1;
  const mon = new Date(today); mon.setDate(today.getDate() - daysSinceMon);
  let weekDone = 0;
  for(let i=0;i<7;i++){
    const wd = new Date(mon); wd.setDate(mon.getDate()+i);
    if(state.completed[dateKey(wd)]) weekDone++;
  }
  document.getElementById('weekDone').textContent = `${weekDone}/6`;

  // Total
  document.getElementById('totalDays').textContent = Object.keys(state.completed).length;
}

function renderContent(){
  const plan = SCHEDULE[activeDay];
  const d = dateForDayOfWeek(activeDay);
  const dk = dateKey(d);
  const isDone = !!state.completed[dk];
  const isToday = activeDay === (new Date()).getDay();
  const container = document.getElementById('content');

  if(plan.isRest){
    container.innerHTML = `
      <div class="card">
        <div class="card-head" style="--accent:${plan.accent};--accent-dark:${plan.accentDark}">
          <div class="card-icon-big">${ic(plan.icon)}</div>
          <div class="card-day-label">${DAYS_FULL[activeDay].toUpperCase()} · ${THAI_MONTHS[d.getMonth()]} ${d.getDate()}</div>
          <div class="card-title">${plan.name}</div>
          <div class="card-focus">${plan.focus}</div>
        </div>
        <div class="rest-day">
          <div class="moon">⌬ OFFLINE ⌬</div>
          <h3 >SLEEP.MODE</h3>
          <p>Body needs rest to rebuild muscle · Sleep early · Hydrate well · System returns ONLINE tomorrow</p>
        </div>
      </div>
    `;
    return;
  }

  // Count total sets
  let totalSets = 0;
  plan.phases.forEach((ph,pi)=>{
    ph.exercises.forEach((ex,ei)=>{
      totalSets += ex.sets || 1;
    });
  });
  let doneSets = 0;
  plan.phases.forEach((ph,pi)=>{
    ph.exercises.forEach((ex,ei)=>{
      const n = ex.sets || 1;
      for(let si=0;si<n;si++){
        const k = `${activeDay}_${pi}_${ei}_${si}`;
        if(state.sets[k]) doneSets++;
      }
    });
  });

  // Phases HTML
  let phasesHTML = '<div class="phases">';
  plan.phases.forEach((ph,pi)=>{
    phasesHTML += `<div class="phase"><div class="phase-label">${ph.label}</div>`;
    ph.exercises.forEach((ex,ei)=>{
      const n = ex.sets || 1;
      const isSingle = n === 1;
      phasesHTML += `<div class="ex">
        <div class="ex-head">
          <div>
            <div class="ex-name">${ex.name}</div>
            ${ex.note?`<div class="ex-note">${ex.note}</div>`:''}
          </div>
          ${!isSingle?`<div class="ex-sets-label"><span class="num">${n}</span> SETS × <br>${ex.reps}</div>`:''}
        </div>`;

      if(isSingle){
        const k = `${activeDay}_${pi}_${ei}_0`;
        const done = !!state.sets[k];
        phasesHTML += `<div class="single-row ${done?'done':''}" data-key="${k}" onclick="toggleSet('${k}')">
          <div class="check"></div>
          <div class="reps-text">${ex.reps}</div>
        </div>`;
      }else{
        phasesHTML += '<div class="sets">';
        for(let si=0;si<n;si++){
          const k = `${activeDay}_${pi}_${ei}_${si}`;
          const done = !!state.sets[k];
          phasesHTML += `<div class="set-row ${done?'done':''}" data-key="${k}" onclick="toggleSet('${k}')">
            <span class="lbl">SET ${si+1}</span>
            <span class="reps">${ex.reps}</span>
          </div>`;
        }
        phasesHTML += '</div>';

        // Rest timer
        if(ex.rest){
          const tkey = `${activeDay}_${pi}_${ei}_rest`;
          phasesHTML += `<div class="rest-row">
            <div class="rest-info">${ic('hourglass')}<span>REST ${ex.rest}s</span></div>
            <button class="rest-btn" id="rest_${tkey}" onclick="toggleRest('${tkey}',${ex.rest})">
              ${ic('play')}<span class="timer-text" id="timer_${tkey}">${ex.rest}s</span>
            </button>
          </div>`;
        }
      }
      phasesHTML += '</div>';
    });
    phasesHTML += '</div>';
  });
  phasesHTML += '</div>';

  const pct = totalSets>0 ? Math.round((doneSets/totalSets)*100) : 0;

  container.innerHTML = `
    <div class="card">
      <div class="card-head" style="--accent:${plan.accent};--accent-dark:${plan.accentDark}">
        <div class="card-icon-big">${ic(plan.icon)}</div>
        <div class="card-day-label">${DAYS_FULL[activeDay].toUpperCase()} · ${THAI_MONTHS[d.getMonth()]} ${d.getDate()}${isToday?' <span class="today-tag">NOW</span>':''}</div>
        <div class="card-title">${plan.name}</div>
        <div class="card-focus">${plan.focus}</div>
        <div class="card-meta">
          <span class="chip coral">${ic('clock')} ${plan.duration}</span>
          <span class="chip">${plan.levelText}</span>
          <span class="chip" id="setCountChip">${doneSets}/${totalSets} SETS</span>
        </div>
      </div>
      ${plan.rationale?`<div class="rationale"><span class="leaf">"</span><div>${plan.rationale}</div></div>`:''}
      ${phasesHTML}
      <div class="progress-block">
        <div class="progress-head">
          <span class="lbl">PROGRESS</span>
          <span class="val" id="progressText">${doneSets}/${totalSets}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <button class="complete-btn ${isDone?'completed':''}" id="completeBtn" onclick="toggleDayComplete()">
      ${isDone?'DAY COMPLETE':'MARK DAY COMPLETE'}
    </button>
  `;
}

// ════════════════════════════════════════════════════════════
// INTERACTIONS
// ════════════════════════════════════════════════════════════
function toggleSet(key){
  const wasUndone = !state.sets[key];
  state.sets[key] = !state.sets[key];
  saveState();
  const row = document.querySelector(`[data-key="${key}"]`);
  if(row) row.classList.toggle('done', state.sets[key]);
  updateProgress();
  
  // Auto-start rest timer when checking a set (not when unchecking)
  if(wasUndone){
    // Parse key: day_phaseIdx_exIdx_setIdx
    const parts = key.split('_');
    const day = parseInt(parts[0]);
    const pi = parseInt(parts[1]);
    const ei = parseInt(parts[2]);
    const si = parseInt(parts[3]);
    const ex = SCHEDULE[day]?.phases?.[pi]?.exercises?.[ei];
    if(ex && ex.rest){
      const n = ex.sets || 1;
      // Don't auto-start after last set of last exercise in phase (no need to rest)
      // But do start between sets and between exercises
      const isLastSetOfWorkout = (si === n - 1) && 
        (ei === SCHEDULE[day].phases[pi].exercises.length - 1) &&
        (pi === SCHEDULE[day].phases.length - 1);
      if(!isLastSetOfWorkout){
        const tkey = `${day}_${pi}_${ei}_rest`;
        // Start the rest timer
        const btn = document.getElementById(`rest_${tkey}`);
        if(btn && !btn.classList.contains('running')){
          startRest(tkey, ex.rest);
        }
      }
    }
  }
}

function updateProgress(){
  const plan = SCHEDULE[activeDay];
  if(plan.isRest) return;
  let total = 0, done = 0;
  plan.phases.forEach((ph,pi)=>{
    ph.exercises.forEach((ex,ei)=>{
      const n = ex.sets || 1;
      total += n;
      for(let si=0;si<n;si++){
        const k = `${activeDay}_${pi}_${ei}_${si}`;
        if(state.sets[k]) done++;
      }
    });
  });
  const pct = total>0 ? Math.round((done/total)*100) : 0;
  const pt = document.getElementById('progressText'); if(pt) pt.textContent = `${done}/${total}`;
  const pf = document.getElementById('progressFill'); if(pf) pf.style.width = pct+'%';
  const cc = document.getElementById('setCountChip'); if(cc) cc.textContent = `${done}/${total} SETS`;
}

let pendingComplete = false;
function toggleDayComplete(){
  const d = dateForDayOfWeek(activeDay);
  const dk = dateKey(d);
  if(state.completed[dk]){
    // Inline unmark — show confirm UI
    if(!pendingComplete){
      pendingComplete = true;
      const btn = document.getElementById('completeBtn');
      btn.innerHTML = 'TAP AGAIN TO UNMARK';
      btn.style.background = 'var(--coral-2)';
      btn.style.borderColor = 'var(--coral-2)';
      setTimeout(()=>{
        if(pendingComplete){pendingComplete=false; renderContent();}
      },2500);
      return;
    }else{
      delete state.completed[dk];
      pendingComplete = false;
      saveState();
      toast('◯ UNMARKED');
    }
  }else{
    state.completed[dk] = true;
    saveState();
    // Auto-pause active timer on completion
    if(stopwatch.running) pauseStopwatch();
    if(manualTimer.running) pauseManualTimer();
    toast('✓ LOGGED · NICE WORK');
  }
  renderTabs();
  renderStreakStrip();
  renderContent();
}

// ════════════════════════════════════════════════════════════
// REST TIMER
// ════════════════════════════════════════════════════════════
function toggleRest(tkey, seconds){
  if(activeTimer && activeTimer.key === tkey){
    stopRest(tkey, seconds);
  }else{
    startRest(tkey, seconds);
  }
}

function startRest(tkey, seconds){
  // Stop any existing timer
  if(activeTimer){
    const oldBtn = document.getElementById(`rest_${activeTimer.key}`);
    const oldKey = activeTimer.key;
    const oldTotal = activeTimer.total;
    clearInterval(activeTimer.interval);
    if(oldBtn){
      oldBtn.classList.remove('running');
      oldBtn.innerHTML = `${ic('play')}<span class="timer-text" id="timer_${oldKey}">${oldTotal}s</span>`;
    }
  }
  const btn = document.getElementById(`rest_${tkey}`);
  if(!btn) return;
  let remaining = seconds;
  btn.classList.remove('done');
  btn.classList.add('running');
  btn.innerHTML = `${ic('pause')}<span class="timer-text" id="timer_${tkey}">${remaining}s</span>`;
  activeTimer = {key:tkey, total:seconds, remaining};
  activeTimer.interval = setInterval(()=>{
    remaining--;
    activeTimer.remaining = remaining;
    const t = document.getElementById(`timer_${tkey}`);
    if(t) t.textContent = `${remaining}s`;
    if(remaining <= 0){
      clearInterval(activeTimer.interval);
      activeTimer = null;
      if(btn){
        btn.classList.remove('running');
        btn.classList.add('done');
        btn.innerHTML = `<span style="font-weight:800">✓</span><span class="timer-text">REST DONE</span>`;
      }
      if(navigator.vibrate) navigator.vibrate([100,50,100]);
      setTimeout(()=>{
        if(btn && !btn.classList.contains('running')){
          btn.classList.remove('done');
          btn.innerHTML = `${ic('play')}<span class="timer-text" id="timer_${tkey}">${seconds}s</span>`;
        }
      },3500);
      toast('⏰ REST OVER · NEXT SET');
    }
  },1000);
}

function stopRest(tkey, seconds){
  if(!activeTimer || activeTimer.key !== tkey) return;
  clearInterval(activeTimer.interval);
  activeTimer = null;
  const btn = document.getElementById(`rest_${tkey}`);
  if(btn){
    btn.classList.remove('running');
    btn.innerHTML = `${ic('play')}<span class="timer-text" id="timer_${tkey}">${seconds}s</span>`;
  }
}

// ════════════════════════════════════════════════════════════
// SESSION TIMER — Dual mode (Stopwatch + Manual Timer)
// ════════════════════════════════════════════════════════════
let timerMode = localStorage.getItem('timer_mode') || 'stopwatch';
let stopwatch = loadStopwatch();
let manualTimer = loadManualTimer();
let tickInterval = null;

function loadStopwatch(){
  try{
    const s = JSON.parse(localStorage.getItem('workout_stopwatch') || '{}');
    if(s.running && s.startTimestamp){
      const now = Date.now();
      const startDateKey = new Date(s.startTimestamp).toDateString();
      const todayDateKey = new Date().toDateString();
      if(startDateKey !== todayDateKey){
        return {elapsed:0, running:false, startTimestamp:null};
      }
      const liveElapsed = s.elapsed + (now - s.startTimestamp);
      return {elapsed:liveElapsed, running:true, startTimestamp:now};
    }
    return {elapsed:s.elapsed||0, running:false, startTimestamp:null};
  }catch(e){
    return {elapsed:0, running:false, startTimestamp:null};
  }
}

function loadManualTimer(){
  try{
    const s = JSON.parse(localStorage.getItem('manual_timer') || '{}');
    return {
      duration: s.duration || 60,
      elapsedBefore: 0, // reset on reload
      running: false,
      startTimestamp: null,
      finished: false
    };
  }catch(e){
    return {duration:60, elapsedBefore:0, running:false, startTimestamp:null, finished:false};
  }
}

function saveStopwatch(){
  localStorage.setItem('workout_stopwatch', JSON.stringify(stopwatch));
}
function saveManualTimer(){
  localStorage.setItem('manual_timer', JSON.stringify({duration:manualTimer.duration}));
}

function fmtTime(ms){
  const total = Math.floor(ms/1000);
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  const pad = n=>String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function getActiveTimer(){
  return timerMode === 'stopwatch' ? stopwatch : manualTimer;
}

function renderTimerBar(){
  const bar = document.getElementById('sessionBar');
  const timeEl = document.getElementById('swTime');
  const labelEl = document.getElementById('swLabel');
  const playBtn = document.getElementById('swPlayBtn');
  if(!timeEl) return;

  const active = getActiveTimer();
  bar.classList.toggle('running', active.running);
  bar.classList.toggle('timer-mode', timerMode === 'timer');
  bar.classList.toggle('timer-finished', timerMode === 'timer' && manualTimer.finished);

  // Update mode tab active state
  document.getElementById('modeStopwatchBtn').classList.toggle('active', timerMode === 'stopwatch');
  document.getElementById('modeTimerBtn').classList.toggle('active', timerMode === 'timer');

  if(timerMode === 'stopwatch'){
    labelEl.innerHTML = '⌬ SESSION TIME';
    let elapsed = stopwatch.elapsed;
    if(stopwatch.running && stopwatch.startTimestamp){
      elapsed = stopwatch.elapsed + (Date.now() - stopwatch.startTimestamp);
    }
    timeEl.textContent = fmtTime(elapsed);
  }else{
    labelEl.innerHTML = manualTimer.finished ? '✓ COMPLETE' : '◷ COUNTDOWN';
    let remaining = manualTimer.duration - manualTimer.elapsedBefore;
    if(manualTimer.running && manualTimer.startTimestamp){
      const live = (Date.now() - manualTimer.startTimestamp) / 1000;
      remaining = manualTimer.duration - manualTimer.elapsedBefore - live;
    }
    remaining = Math.max(0, Math.ceil(remaining));
    timeEl.textContent = fmtTime(remaining * 1000);

    // Update preset highlights
    document.querySelectorAll('.preset-btn').forEach(btn=>{
      btn.classList.toggle('active', parseInt(btn.dataset.sec) === manualTimer.duration);
    });
  }

  playBtn.innerHTML = active.running ? ic('pause') : ic('play');
}

function switchMode(mode){
  if(timerMode === mode) return;
  timerMode = mode;
  localStorage.setItem('timer_mode', mode);
  // Re-evaluate ticker
  ensureTicker();
  renderTimerBar();
}

function ensureTicker(){
  const needTick = stopwatch.running || manualTimer.running;
  if(needTick && !tickInterval){
    tickInterval = setInterval(tick, 250);
  }else if(!needTick && tickInterval){
    clearInterval(tickInterval);
    tickInterval = null;
  }
}

function tick(){
  // Check if manual timer finished
  if(manualTimer.running && manualTimer.startTimestamp){
    const live = (Date.now() - manualTimer.startTimestamp) / 1000;
    if(manualTimer.elapsedBefore + live >= manualTimer.duration){
      finishManualTimer();
      return;
    }
  }
  renderTimerBar();
}

// — STOPWATCH —
function startStopwatch(){
  if(stopwatch.running) return;
  stopwatch.running = true;
  stopwatch.startTimestamp = Date.now();
  saveStopwatch();
  ensureTicker();
  renderTimerBar();
}

function pauseStopwatch(){
  if(!stopwatch.running) return;
  stopwatch.elapsed += Date.now() - stopwatch.startTimestamp;
  stopwatch.running = false;
  stopwatch.startTimestamp = null;
  saveStopwatch();
  ensureTicker();
  renderTimerBar();
}

function resetStopwatch(){
  if(stopwatch.running){
    if(tickInterval) clearInterval(tickInterval);
    tickInterval = null;
  }
  stopwatch = {elapsed:0, running:false, startTimestamp:null};
  saveStopwatch();
  ensureTicker();
  renderTimerBar();
}

// — MANUAL TIMER —
function setTimerDuration(seconds){
  if(manualTimer.running) pauseManualTimer();
  manualTimer.duration = seconds;
  manualTimer.elapsedBefore = 0;
  manualTimer.finished = false;
  saveManualTimer();
  renderTimerBar();
}

function startManualTimer(){
  if(manualTimer.running) return;
  // If finished, reset before starting
  if(manualTimer.finished || manualTimer.elapsedBefore >= manualTimer.duration){
    manualTimer.elapsedBefore = 0;
    manualTimer.finished = false;
  }
  manualTimer.running = true;
  manualTimer.startTimestamp = Date.now();
  ensureTicker();
  renderTimerBar();
}

function pauseManualTimer(){
  if(!manualTimer.running) return;
  const live = (Date.now() - manualTimer.startTimestamp) / 1000;
  manualTimer.elapsedBefore += live;
  manualTimer.running = false;
  manualTimer.startTimestamp = null;
  ensureTicker();
  renderTimerBar();
}

function finishManualTimer(){
  manualTimer.running = false;
  manualTimer.startTimestamp = null;
  manualTimer.elapsedBefore = manualTimer.duration;
  manualTimer.finished = true;
  ensureTicker();
  renderTimerBar();
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,400]);
  toast('◉ TIMER COMPLETE');
}

function resetManualTimer(){
  if(manualTimer.running){
    clearInterval(tickInterval);
    tickInterval = null;
    manualTimer.running = false;
    manualTimer.startTimestamp = null;
  }
  manualTimer.elapsedBefore = 0;
  manualTimer.finished = false;
  ensureTicker();
  renderTimerBar();
}

// — UNIFIED HANDLERS —
function toggleActive(){
  if(timerMode === 'stopwatch'){
    if(stopwatch.running) pauseStopwatch();
    else startStopwatch();
  }else{
    if(manualTimer.running) pauseManualTimer();
    else startManualTimer();
  }
}

function resetActive(){
  // Double-tap confirm
  const btn = document.getElementById('swResetBtn');
  if(btn.dataset.confirming){
    delete btn.dataset.confirming;
    btn.style.background = '';
    btn.style.borderColor = '';
    if(timerMode === 'stopwatch') resetStopwatch();
    else resetManualTimer();
    toast('◯ RESET');
    return;
  }
  btn.dataset.confirming = '1';
  btn.style.background = 'var(--magenta)';
  btn.style.borderColor = 'var(--magenta)';
  setTimeout(()=>{
    if(btn.dataset.confirming){
      delete btn.dataset.confirming;
      btn.style.background = '';
      btn.style.borderColor = '';
    }
  },2000);
  toast('TAP AGAIN TO RESET');
}

// Start ticker if anything was running on load
ensureTicker();

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
renderHeader();
renderStreakStrip();
renderTabs();
renderContent();
renderTimerBar();
// Init reset button icon
document.querySelector('.sw-btn.ghost').innerHTML = ic('reset');

// Show pre-marked toast on first load
if(state._preMarkedInit && state._preMarked && Object.keys(state._preMarked).length > 0 && !state._preMarkedShown){
  setTimeout(()=>{
    toast('✓ MON & TUE PRE-LOGGED');
  }, 800);
  state._preMarkedShown = true;
  saveState();
}
</script>
